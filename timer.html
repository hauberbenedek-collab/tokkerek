  :root{--num:#fff;--shade:#3f3f3f;--bg:transparent}
  #panel{background:var(--bg);padding:1.2vh 2.5vw;text-align:center}
  #label{font-size:min(6vw,11vh);color:var(--num);text-shadow:.1em .1em 0 var(--shade);text-align:center}
  #label:empty{display:none}
  #time{font-size:min(23vw,58vh);line-height:1.05;color:var(--num);text-shadow:.07em .07em 0 var(--shade);white-space:nowrap}
  body.st.paused #time{color:#ffff55}
  body.st.low #time{color:#ff5555}
  body.st.done #time{color:#ff5555}
  body.done #time{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.2}}

  #controls{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:rgba(0,0,0,.6);
    display:flex;flex-direction:column;gap:8px;align-items:center;font-size:14px}
  body.nc #controls{display:none}
  .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
  button,input{font:inherit;font-size:14px;color:#fff;border-radius:0}
  button{padding:7px 12px;cursor:pointer;background:#707070;border:3px solid;
    border-color:#bdbdbd #3a3a3a #3a3a3a #bdbdbd;text-shadow:2px 2px 0 #3f3f3f}
  button:hover{background:#7d8ac7}
  button:focus-visible,input:focus-visible{outline:3px solid #ffff55;outline-offset:1px}
  button.go{background:#3f8f2f}
  button.go:hover{background:#55b341}
  input{background:#111;border:3px solid;border-color:#3a3a3a #bdbdbd #bdbdbd #3a3a3a;padding:6px;text-align:center}
  input[type=number]{width:56px}
  input[type=text]{width:190px;text-align:left}
  input.hex{width:84px;text-align:center}
  input[type=color]{width:44px;height:34px;padding:0;background:#111;cursor:pointer}
  input[type=range]{width:120px;padding:0}
  label{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="view">
  <div id="panel">
    <div id="label"></div>
    <div id="time">05:00</div>
  </div>
</div>

<div id="controls">
  <div class="row">
    <input id="inDay" type="number" min="0" value="0" aria-label="Nap">
    <span>nap</span>
    <input id="inHour" type="number" min="0" value="0" aria-label="Óra">
    <span>óra</span>
    <input id="inMin" type="number" min="0" value="5" aria-label="Perc">
    <span>perc</span>
    <input id="inSec" type="number" min="0" value="0" aria-label="Másodperc">
    <span>mp</span>
    <button id="setBtn">Beállít</button>
    <input id="inLabel" type="text" placeholder="Felirat (nem kötelező)" maxlength="40" aria-label="Felirat">
  </div>
  <div class="row">
    <button data-set="60">1 perc</button>
    <button data-set="120">2 perc</button>
    <button data-set="300">5 perc</button>
    <button data-set="600">10 perc</button>
    <button data-adj="-60">-1 perc</button>
    <button data-adj="-10">-10 mp</button>
    <button data-adj="10">+10 mp</button>
    <button data-adj="60">+1 perc</button>
  </div>
  <div class="row">
    <span>szám</span><input id="cNum" type="color" aria-label="Szám színe"><input id="hNum" class="hex" type="text" maxlength="7" aria-label="Szám színe (hex)">
    <span>árnyék</span><input id="cShade" type="color" aria-label="Árnyék színe"><input id="hShade" class="hex" type="text" maxlength="7" aria-label="Árnyék színe (hex)">
    <span>háttér</span><input id="cBg" type="color" aria-label="Háttér színe"><input id="hBg" class="hex" type="text" maxlength="7" aria-label="Háttér színe (hex)">
  </div>
  <div class="row">
    <span>háttér átlátszatlansága</span><input id="cOp" type="range" min="0" max="100" step="1" aria-label="Háttér átlátszatlansága"><span id="opVal">0%</span>
    <label><input id="cSt" type="checkbox"> állapotszínek</label>
    <button id="styleReset">Alap kinézet</button>
  </div>
  <div class="row">
    <button id="toggleBtn" class="go">Start</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script>
const KEY = "tokkerek_timer", HIDE_KEY = "tokkerek_timer_hide", STYLE_KEY = "tokkerek_timer_style";
const el = id => document.getElementById(id);
const timeEl = el("time"), labelEl = el("label"), toggleBtn = el("toggleBtn");
let st = { running:false, remaining:300000, endAt:0, total:300000, label:"" };

try{
  const v = JSON.parse(localStorage.getItem(KEY));
  if(v && typeof v.remaining === "number") st = Object.assign(st, v);
}catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };

const left = () => st.running ? Math.max(0, st.endAt - Date.now()) : st.remaining;

/* A formátumot a teljes beállított idő dönti el, hogy a kiírás ne ugráljon: 1 napnál hosszabb időnél n:ÓÓ:PP:MM,
   1 óránál hosszabbnál ÓÓ:PP:MM, egyébként PP:MM */
function fmt(ms, total){
  const s = Math.ceil(ms/1000), t = Math.ceil((total || ms)/1000);
  const d = Math.floor(s/86400), h = Math.floor(s % 86400/3600), m = Math.floor(s % 3600/60), r = s % 60;
  const p = n => String(n).padStart(2,"0");
  if(t >= 86400) return d + ":" + p(h) + ":" + p(m) + ":" + p(r);
  if(t >= 3600) return p(Math.floor(s/3600)) + ":" + p(m) + ":" + p(r);
  return p(Math.floor(s/60)) + ":" + p(r);
}
function fillInputs(sec){
  el("inDay").value = Math.floor(sec/86400);
  el("inHour").value = Math.floor(sec % 86400/3600);
  el("inMin").value = Math.floor(sec % 3600/60);
  el("inSec").value = sec % 60;
}

function render(){
  let ms = left();
  if(st.running && ms === 0){ st.running = false; st.remaining = 0; save(); }
  const txt = fmt(ms, st.total).replace(/0/g, "O");
  timeEl.textContent = txt;
  timeEl.style.fontSize = "min(" + (115/txt.length).toFixed(2) + "vw,58vh)"; /* hosszabb kiírásnál kisebb betű */
  labelEl.textContent = st.label;
  document.title = fmt(ms, st.total) + " | Tökfaragás időzítő";
  const b = document.body.classList;
  b.toggle("done", ms === 0);
  b.toggle("low", ms > 0 && ms <= 10000);
  b.toggle("paused", !st.running && ms > 0 && ms < st.total);
  toggleBtn.textContent = st.running ? "Megállít" : "Start";
}

function setTime(sec){
  st.total = st.remaining = Math.max(0, sec)*1000;
  st.running = false;
  fillInputs(sec);
  save(); render();
}
function start(){
  if(st.remaining <= 0) return;
  st.endAt = Date.now() + st.remaining; st.running = true; save(); render();
}
function stop(){ st.remaining = left(); st.running = false; save(); render(); }
function toggle(){ st.running ? stop() : start(); }
function reset(){ st.remaining = st.total; st.running = false; save(); render(); }
function adjust(sec){
  const next = Math.max(0, left() + sec*1000);
  if(st.running) st.endAt = Date.now() + next; else st.remaining = next;
  st.total = Math.max(st.total, next);
  save(); render();
}

el("setBtn").onclick = () => setTime(Math.round(
  (+el("inDay").value||0)*86400 + (+el("inHour").value||0)*3600 + (+el("inMin").value||0)*60 + (+el("inSec").value||0)));
["inDay","inHour","inMin","inSec"].forEach(id => el(id).addEventListener("keydown", e => { if(e.key === "Enter") el("setBtn").click(); }));
el("inLabel").value = st.label;
el("inLabel").oninput = e => { st.label = e.target.value; save(); render(); };
toggleBtn.onclick = toggle;
el("resetBtn").onclick = reset;
document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => setTime(+b.dataset.set));
document.querySelectorAll("[data-adj]").forEach(b => b.onclick = () => adjust(+b.dataset.adj));
document.addEventListener("click", e => { if(e.target.tagName === "BUTTON") e.target.blur(); });

/* Kinézet: színek, háttér, átlátszatlanság. A böngésző tárolja, az OBS frissítése után is megmarad. */
const DEF = { num:"#ffffff", shade:"#3f3f3f", bg:"#000000", op:0, st:true };
const hexOk = h => /^#[0-9a-f]{6}$/i.test(h);
let sty = Object.assign({}, DEF);
try{ Object.assign(sty, JSON.parse(localStorage.getItem(STYLE_KEY)) || {}); }catch(e){}
["num","shade","bg"].forEach(k => { if(!hexOk(sty[k])) sty[k] = DEF[k]; });
sty.op = Math.min(100, Math.max(0, Math.round(+sty.op || 0)));
sty.st = sty.st !== false;

function applyStyle(){
  const r = document.documentElement.style, n = parseInt(sty.bg.slice(1), 16);
  r.setProperty("--num", sty.num);
  r.setProperty("--shade", sty.shade);
  r.setProperty("--bg", "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + (sty.op/100) + ")");
  document.body.classList.toggle("st", sty.st);
  try{ localStorage.setItem(STYLE_KEY, JSON.stringify(sty)); }catch(e){}
}
function syncStyleInputs(){
  [["num","cNum","hNum"],["shade","cShade","hShade"],["bg","cBg","hBg"]].forEach(([k,c,h]) => {
    el(c).value = sty[k]; el(h).value = sty[k];
  });
  el("cOp").value = sty.op; el("opVal").textContent = sty.op + "%";
  el("cSt").checked = sty.st;
}
[["num","cNum","hNum"],["shade","cShade","hShade"],["bg","cBg","hBg"]].forEach(([k,c,h]) => {
  el(c).oninput = () => { sty[k] = el(c).value; el(h).value = sty[k]; applyStyle(); };
  el(h).oninput = () => {
    let v = el(h).value.trim(); if(v[0] !== "#") v = "#" + v;
    if(hexOk(v)){ sty[k] = v.toLowerCase(); el(c).value = sty[k]; applyStyle(); }
  };
  el(h).addEventListener("keydown", e => { if(e.key === "Enter") e.target.blur(); });
});
el("cOp").oninput = e => { sty.op = +e.target.value; el("opVal").textContent = sty.op + "%"; applyStyle(); };
el("cOp").addEventListener("change", e => e.target.blur());
el("cSt").onchange = e => { sty.st = e.target.checked; applyStyle(); e.target.blur(); };
el("styleReset").onclick = () => { sty = Object.assign({}, DEF); syncStyleInputs(); applyStyle(); };
syncStyleInputs(); applyStyle();

/* Billentyűk (OBS Interact ablak): Szóköz start/stop, R reset, H gombok elrejtése */
function setHidden(h){
  document.body.classList.toggle("nc", h);
  try{ localStorage.setItem(HIDE_KEY, h ? "1" : "0"); }catch(e){}
}
addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if(k === " "){ e.preventDefault(); toggle(); }
  else if(k === "r") reset();
  else if(k === "h") setHidden(!document.body.classList.contains("nc"));
});

let hidden = false;
try{ hidden = localStorage.getItem(HIDE_KEY) === "1"; }catch(e){}
if(new URLSearchParams(location.search).get("controls") === "0") hidden = true;
setHidden(hidden);

fillInputs(Math.round(st.total/1000));
render();
setInterval(render, 100);
</script>
</body>
</html>
